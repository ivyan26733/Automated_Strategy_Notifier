name: Keep Workflows Alive

on:
  schedule:
    # Every Sunday at 10:00 UTC — well within the 60-day inactivity limit
    - cron: '0 10 * * 0'
  workflow_dispatch:

jobs:
  keepalive:
    name: Prevent scheduled-workflow disable
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable NSE Scanner workflow
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = ['scanner.yml'];
            for (const wf of workflows) {
              try {
                await github.rest.actions.enableWorkflow({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: wf,
                });
                console.log(`✓ Enabled: ${wf}`);
              } catch (e) {
                console.log(`Already enabled or not found: ${wf} — ${e.message}`);
              }
            }
