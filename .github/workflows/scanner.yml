name: NSE Scanner

on:
  schedule:
    # Mon-Fri at 4:30 PM IST (11:00 UTC)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 'Re-download market data from Yahoo Finance?'
        type: boolean
        default: true

jobs:
  scan:
    name: Run NSE Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: scanner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "
          from app.scanner.runner import run
          refresh = '${{ github.event.inputs.refresh_data }}' != 'false'
          print(f'refresh_data={refresh}')
          s = run(refresh_data=refresh)
          print()
          print('===== Scanner Summary =====')
          print(f'Stocks processed : {s[\"stocks_processed\"]}')
          print(f'Signals created  : {s[\"signals_created\"]}')
          print(f'Status           : {s[\"status\"]}')
          print(f'Duration         : {s[\"elapsed_seconds\"]}s')
          if s['status'] != 'success':
              raise SystemExit(1)
          "
